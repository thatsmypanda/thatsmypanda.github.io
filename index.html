<style>
  :root{ --bg:#07090c; --teal:#1db7c1; --glow:rgba(29,183,193,.55); --text:#d7f3f5; --dim:#5f8a8f; }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg)}
  body{
    font-family:VT323,"Courier New",monospace; color:var(--text); font-size:1.5rem;
    min-height:100svh; display:grid; place-items:center; overflow-x:hidden;
    padding:calc(8vh + 1.5rem) 1.25rem calc(8vh + 1.5rem);
    background:
      radial-gradient(ellipse at 50% 38%, rgba(29,183,193,.16) 0, transparent 55%),
      linear-gradient(180deg,#0a0e13 0,#05070a 100%);
  }
  /* cinematic letterbox bars with HUD text */
  .bar-top,.bar-bot{
    position:fixed; left:0; right:0; height:min(8vh,64px); background:#000; z-index:6;
    display:flex; align-items:center; justify-content:space-between; padding:0 1.25rem;
    font-family:"Press Start 2P",monospace; font-size:.55rem; letter-spacing:.08em; color:var(--dim);
  }
  .bar-top{top:0;border-bottom:2px solid rgba(29,183,193,.35)}
  .bar-bot{bottom:0;border-top:2px solid rgba(29,183,193,.35)}
  .blink{animation:blink 1.1s steps(2,jump-none) infinite; color:var(--teal)}
  main{position:relative; z-index:3; width:min(34rem,100%); text-align:center}
  .logo{position:relative; width:clamp(170px,46vw,270px); margin:0 auto}
  .logo::before{
    content:""; position:absolute; inset:-18%; border-radius:50%;
    background:radial-gradient(circle,var(--glow) 0,transparent 68%); animation:aura 4s ease-in-out infinite;
  }
  .logo img{position:relative; width:100%; height:auto; display:block; animation:bob 4s ease-in-out infinite}
  h1{
    font-family:"Press Start 2P",monospace; font-weight:400; line-height:1.5;
    font-size:clamp(1rem,5.4vw,2.1rem); margin:1.6rem 0 1.4rem; color:#eafdff;
    text-shadow:0 0 6px var(--teal),0 0 18px var(--teal),0 0 42px rgba(29,183,193,.6);
    animation:flicker 6s linear infinite;
  }
  .dialog{
    text-align:left; border:3px solid var(--teal); background:rgba(0,0,0,.6); padding:.9rem 1.1rem 1rem;
    box-shadow:5px 5px 0 rgba(29,183,193,.35), 0 0 24px rgba(29,183,193,.18); min-height:7.2rem; line-height:1.15;
  }
  .dialog small{display:block; font-family:"Press Start 2P",monospace; font-size:.55rem; color:var(--teal); margin-bottom:.6rem; letter-spacing:.1em}
  .cursor{display:inline-block; width:.55em; height:1em; background:var(--teal); vertical-align:-.12em; margin-left:2px; animation:blink 1s steps(2,jump-none) infinite}
  .load{margin-top:1.6rem; text-align:left}
  .load span{font-family:"Press Start 2P",monospace; font-size:.6rem; color:var(--dim); letter-spacing:.08em}
  .track{height:22px; margin-top:.6rem; border:3px solid var(--teal); padding:3px; background:#000}
  .track i{display:block; height:100%; width:0;
    background:repeating-linear-gradient(90deg,var(--teal) 0 10px,transparent 10px 14px);
    box-shadow:0 0 12px var(--glow); animation:load 3.2s .4s steps(14,end) forwards}
  /* atmosphere */
  #rain{position:fixed; inset:0; width:100%; height:100%; z-index:2; pointer-events:none}
  .scan,.vig,.grain{position:fixed; inset:0; pointer-events:none; z-index:5}
  .scan{background:repeating-linear-gradient(180deg,transparent 0 2px,rgba(0,0,0,.28) 2px 3px)}
  .vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
  .grain{
    inset:-50%; width:200%; height:200%; opacity:.09; animation:grain .9s steps(6) infinite;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  @keyframes blink{50%{opacity:0}}
  @keyframes bob{50%{transform:translateY(-8px)}}
  @keyframes aura{50%{opacity:.55;transform:scale(1.08)}}
  @keyframes load{to{width:68%}}
  @keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-6%,4%)}40%{transform:translate(5%,-7%)}60%{transform:translate(-4%,-3%)}80%{transform:translate(7%,6%)}100%{transform:translate(0,0)}}
  @keyframes flicker{0%,18%,22%,62%,64%,100%{opacity:1}19%,21%,63%{opacity:.35}20%{opacity:.8}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important} #rain{display:none} .track i{width:68%}}
  @media (max-width:480px){body{font-size:1.3rem} .bar-top span:last-child{display:none}}
</style>
</head>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // typewriter
  var el = document.getElementById('type'), txt = el.dataset.text, i = 0;
  if (reduce) { el.textContent = txt; } else {
    (function tick(){ el.textContent = txt.slice(0, ++i); if (i < txt.length) setTimeout(tick, 38); })();
  }
  // rain
  if (reduce) return;
  var c = document.getElementById('rain'), x = c.getContext('2d'), w, h, drops = [];
  function size(){
    w = c.width = innerWidth; h = c.height = innerHeight;
    drops = Array.from({length: Math.min(160, Math.floor(w / 9))}, function(){
      return {x: Math.random()*w, y: Math.random()*h, l: 10+Math.random()*18, s: 9+Math.random()*9};
    });
  }
  size(); addEventListener('resize', size);
  (function frame(){
    x.clearRect(0,0,w,h); x.strokeStyle = 'rgba(29,183,193,.35)'; x.lineWidth = 1; x.beginPath();
    drops.forEach(function(d){
      x.moveTo(d.x, d.y); x.lineTo(d.x - d.l*.25, d.y + d.l);
      d.y += d.s; d.x -= d.s*.25;
      if (d.y > h) { d.y = -d.l; d.x = Math.random()*w + 40; }
    });
    x.stroke(); requestAnimationFrame(frame);
  })();
})();
</script>
